---
permalink: /portal/
eleventyExcludeFromCollections: true
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>CSA Portal</title>
<script>/* apply saved theme before first paint so there's no flash */(function(){try{if(localStorage.getItem("csa-portal-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;--card:#fff;--side:#0f172a;--side-2:#111c33;--ink:#0f172a;--muted:#667085;
    --line:#e7eaf0;--blue:#2563eb;--blue-600:#1d4ed8;--blue-weak:#eef4ff;
    --up:#12805c;--up-bg:#e7f6ef;--down:#c0362c;--down-bg:#fdecea;
    --btn:#eef1f6;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
    --row-hover:#f8fafc;--input-bg:#fff;--on-accent:#fff;--grid:#eef1f6;--tip-d:#9db2ff;
  }
  /* Dark mode, mirrors the live site: #0A0A0A ground, warm off-white ink, amber accent */
  [data-theme="dark"]{
    --bg:#0A0A0A;--card:#111111;--side:#070707;--side-2:#161616;
    --ink:#F5F1EA;--muted:rgba(245,241,234,.62);
    --line:rgba(245,241,234,.10);
    --blue:#FFA10C;--blue-600:#FFB63F;--blue-weak:rgba(255,161,12,.14);
    --up:#3FBF7F;--up-bg:rgba(63,191,127,.16);--down:#FF6B5E;--down-bg:rgba(255,107,94,.16);
    --btn:rgba(245,241,234,.06);--shadow:0 1px 2px rgba(0,0,0,.5);
    --row-hover:rgba(245,241,234,.04);--input-bg:#161616;--on-accent:#0A0A0A;--grid:rgba(245,241,234,.10);
    --tip-d:#FFA10C;
  }
  html{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark}
  body,.top,.card,.side,input,textarea,select{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* shell */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:var(--side);color:#c7cede;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
  .side__logo{height:30px;width:auto;align-self:flex-start;object-fit:contain;margin:8px 10px 24px;display:block}
  .side__group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5f6b85;padding:10px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#aeb6c7;transition:background .15s,color .15s}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
  .nav a.is-active{color:var(--on-accent);background:var(--blue)}
  .nav .ic{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-size:11px;font-weight:700;color:#cdd5e6}
  .nav a.is-active .ic{background:rgba(255,255,255,.22);color:var(--on-accent)}
  .side__foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
  .side__user{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;color:#c7cede}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-600));display:grid;place-items:center;color:var(--on-accent);font-size:12px;font-weight:600}

  .main{min-width:0}
  .top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  .top h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .top__right{display:flex;align-items:center;gap:12px}
  .themetog{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--btn);color:var(--muted);display:grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s,border-color .15s}
  .themetog:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  .themetog svg{width:16px;height:16px;display:block}
  .themetog .i-moon{display:none}
  [data-theme="dark"] .themetog .i-sun{display:none}
  [data-theme="dark"] .themetog .i-moon{display:block}
  .top .crumb{font-size:12.5px;color:var(--muted)}
  .content{max-width:1180px;margin:0 auto;padding:26px 28px 70px}

  .btn{font-size:13px;font-weight:500;color:var(--ink);background:var(--btn);border:1px solid var(--line);padding:8px 14px;border-radius:9px;transition:background .15s,color .15s,border-color .15s}
  .btn:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  .btn--primary{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  .btn--primary:hover{background:var(--blue-600);border-color:var(--blue-600)}
  .btn--ghost{background:transparent}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .cardhead{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 0}
  .cardhead h2{font-size:14px;font-weight:600}
  .cardhead .tag{font-size:12px;color:var(--muted)}

  /* dashboard */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{padding:18px 20px}
  .kpi__label{font-size:12.5px;color:var(--muted);font-weight:500}
  .kpi__val{font-size:27px;font-weight:700;letter-spacing:-.03em;margin:8px 0;font-variant-numeric:tabular-nums}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
  .delta.up{color:var(--up);background:var(--up-bg)}.delta.down{color:var(--down);background:var(--down-bg)}
  .delta .vs{color:var(--muted);font-weight:500;margin-left:2px}
  .chartcard{margin-bottom:16px;padding-bottom:8px}
  .chartwrap{position:relative;padding:8px 12px 4px}
  .chartwrap svg{display:block;width:100%;height:auto}
  .tip{position:absolute;pointer-events:none;background:var(--side);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .tip .d{color:var(--tip-d)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .scgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:0 0 var(--radius) var(--radius);overflow:hidden;margin-top:14px}
  .sc{background:var(--card);padding:15px 20px}
  .sc__l{font-size:12px;color:var(--muted)}.sc__v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:4px 0;font-variant-numeric:tabular-nums}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:11px 20px;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 20px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.row{cursor:pointer;transition:background .12s}
  tbody tr.row:hover{background:var(--row-hover)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);vertical-align:middle;margin-right:8px}
  .up-t{color:var(--up);font-weight:600}.down-t{color:var(--down);font-weight:600}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--blue-weak);color:var(--blue-600)}
  .thumb{width:40px;height:28px;border-radius:5px;object-fit:cover;background:var(--btn);vertical-align:middle;margin-right:10px}

  /* list header */
  .lhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .lhead h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
  .lhead .sub{font-size:13px;color:var(--muted);margin-top:2px}

  /* edit form */
  .form{max-width:760px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--input-bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}
  .field textarea{resize:vertical;min-height:96px;line-height:1.55}
  .field textarea.md{min-height:280px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .imgprev{width:100%;max-width:320px;border-radius:9px;border:1px solid var(--line);margin-top:8px;display:block}
  .formbar{position:sticky;bottom:0;background:linear-gradient(var(--bg),var(--bg));backdrop-filter:blur(4px);padding:14px 0;margin-top:8px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
  .note{font-size:12.5px;color:var(--muted);background:var(--blue-weak);border:1px solid var(--blue-weak);padding:11px 15px;border-radius:10px;margin-bottom:20px}
  .note b{color:var(--blue-600)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  /* section dividers (SEO = final step) */
  .section-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:30px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .section-h .step{background:var(--blue-weak);color:var(--blue-600);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;text-transform:none}
  /* visual block builder */
  .blocks{display:flex;flex-direction:column;gap:10px}
  .block{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden}
  .block__bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--row-hover);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .block__bar .ic{width:20px;height:20px;border-radius:5px;background:var(--blue-weak);color:var(--blue-600);display:grid;place-items:center;font-size:11px}
  .block__ctrl{margin-left:auto;display:flex;gap:4px}
  .block__ctrl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:#667085;font-size:12px}
  .block__ctrl button:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  .block__body{padding:12px;display:flex;flex-direction:column;gap:8px}
  .block__body textarea,.block__body input{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .block__body textarea{resize:vertical;min-height:70px;line-height:1.55}
  .addblock{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:13px;border:1px dashed #cfd6e4;border-radius:11px;background:#fbfcfe}
  .addblock>span{font-size:12.5px;color:var(--muted);align-self:center;margin-right:2px}
  .addblock button{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
  .addblock button:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  /* media toggle + image carousel */
  .mtoggle{display:inline-flex;background:var(--btn);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
  .mtoggle button{font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;padding:7px 16px;border-radius:7px}
  .mtoggle button.on{background:var(--blue);color:var(--on-accent)}
  .carousel{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .carousel__item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
  .carousel__n{width:26px;height:26px;border-radius:6px;background:var(--blue-weak);color:var(--blue-600);display:grid;place-items:center;font-size:12px;font-weight:700}
  .carousel__f{display:flex;flex-direction:column;gap:8px;min-width:0}
  .carousel__f input{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
  .carousel__c{display:flex;gap:4px}
  .carousel__c button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:#667085;font-size:12px}
  .carousel__c button:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  /* stats repeater */
  .statrow{display:grid;grid-template-columns:1fr 1.5fr 36px;gap:8px;margin-bottom:8px}
  .statrow input{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .statrow button{border:1px solid var(--line);background:var(--card);border-radius:8px;color:#c0362c;font-size:14px}
  .statrow button:hover{background:#fdecea;border-color:#f3b4ad}
  /* seo */
  .seo-check{margin-top:11px;display:flex;flex-direction:column;gap:7px;font-size:13px}
  .seo-check .c{display:flex;align-items:center;gap:9px;color:var(--muted)}
  .seo-check .dot{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;flex-shrink:0}
  .seo-check .ok .dot{background:var(--up)}.seo-check .bad .dot{background:#c0362c}.seo-check .warn .dot{background:#c98a1e}
  .counter{font-size:12px;color:var(--muted);margin-top:6px}
  .counter.good{color:var(--up)}.counter.bad{color:#c0362c}
  .serp{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
  .serp__t{color:#1a0dab;font-size:17px;line-height:1.3}
  .serp__u{color:#006621;font-size:12.5px;margin:3px 0}
  .serp__d{color:#4d5156;font-size:13px;line-height:1.45}
  /* list tools + status pills */
  .ltools{display:flex;gap:8px}
  .lsearch{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:210px}
  .lselect{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--card)}
  .lsearch:focus,.lselect:focus{outline:none;border-color:var(--blue)}
  .pill--pub{background:var(--up-bg);color:var(--up)}
  .pill--draft{background:var(--btn);color:#667085}
  .pill--sched{background:#fdf3e3;color:#b26b06}
  /* publish box in editor */
  .pubbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 16px;margin-bottom:6px}
  .pubbox__l{font-size:13px;font-weight:600}
  .pubbox select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .pubbox__hint{font-size:12px;color:var(--muted);margin-left:auto}
  /* relation picker */
  .relbox{display:flex;flex-wrap:wrap;gap:9px 16px;border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:var(--card)}
  .relopt{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .relopt input{width:auto;accent-color:var(--blue)}
  /* media library */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-top:16px}
  .masset{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card);position:relative;transition:border-color .15s,transform .15s}
  .masset:hover{border-color:var(--blue);transform:translateY(-2px)}
  .masset__img{aspect-ratio:4/3;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#0f172a}
  .masset__n{font-size:11.5px;color:var(--muted);padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .masset.copied::after{content:"Copied ✓";position:absolute;inset:0;background:var(--blue);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:600}
  /* row actions */
  .ractd{text-align:right;white-space:nowrap}
  .rowacts{display:inline-flex;gap:6px;opacity:.4;transition:opacity .15s}
  tr.row:hover .rowacts{opacity:1}
  .ra{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-block}
  .ra:hover{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
  .ra--tog:hover{background:#0f172a;border-color:#0f172a}
  /* site health */
  .hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:8px}
  @media(max-width:820px){.hcards{grid-template-columns:repeat(2,1fr)}}
  .hkpi{padding:18px 20px}
  .hkpi__v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .hkpi__l{font-size:12.5px;color:var(--muted);margin-top:4px}
  .hdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px;vertical-align:middle}
  .hbad{background:var(--down)}.hwarn{background:#e0a106}
  .hkpi__d{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.45}
  .catpill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .cat--seo{background:#eef4ff;color:#1d4ed8}
  .cat--a11y{background:#fdecea;color:#c0362c}
  .cat--media{background:#fdf3e3;color:#b26b06}
  .cat--content{background:var(--btn);color:var(--muted)}
  /* nav dropdown groups */
  .nav__grp{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;cursor:pointer;font:inherit;color:var(--nav-ink,#c9cdd6);padding:9px 12px;border-radius:8px;text-align:left}
  .nav__grp:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav__grp .chev{margin-left:auto;transition:transform .18s ease;opacity:.6;font-size:10px}
  .nav__grp.open .chev{transform:rotate(90deg)}
  .nav__sub{display:none;margin:2px 0 4px 0;padding-left:14px}
  .nav__grp.open + .nav__sub{display:block}
  .nav__sub a{display:block;padding:7px 12px 7px 22px;border-radius:8px;font-size:13px;color:var(--nav-ink,#c9cdd6);text-decoration:none}
  .nav__sub a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav__sub a.is-active{background:var(--blue);color:var(--on-accent)}
  /* users */
  .uav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-600));color:var(--on-accent);font-size:11px;font-weight:600;display:inline-grid;place-items:center;margin-right:10px;vertical-align:middle}
  .urole{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--blue-weak);color:var(--blue-600)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="side__logo" src="/brand/CSA_Script_Logo_White.png" alt="CSA" />
    <div class="side__group">Overview</div>
    <nav class="nav" id="nav"></nav>
    <div class="side__foot">
      <a class="side__user" href="/" target="_blank"><span class="ic" style="width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-size:12px">↗</span> View live site</a>
      <div class="side__user"><span class="avatar">CL</span><span>Chad Lancaster</span></div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="topTitle">Dashboard</h1><div class="crumb" id="crumb"></div></div>
      <div class="top__right">
        <div id="topActions"></div>
        <button type="button" class="themetog" id="themetog" aria-label="Toggle dark mode" title="Toggle dark mode">

  // ---- router ----

      if(p[2]==="e"&&p[3]) return {kind:"edit",col:p[1],slug:decodeURIComponent(p[3])};
      if(p[2]==="new") return {kind:"edit",col:p[1],slug:null};
      return {kind:"list",col:p[1]};
    }
    return {kind:"dash"};
  }

  function render(){
    var r=parse();

    else if(r.kind==="users"){setActive("users");renderUsers();}

  }

  // ---- dashboard ----

    +'<div class="grid2">'
    +'<section class="card"><div class="cardhead"><h2>Top pages</h2><span class="tag">by pageviews</span></div>'
    +tbl(["Page","Views","Δ"],[
      ['<span class="bar" style="width:64px"></span>/the-wire/afrobeats-atlas/','9,204','<span class="up-t">+22%</span>'],

    +tbl(["Top query","Clicks","Pos."],[["csa global","1,204","1.2"],["afrobeats trends 2026","642","4.8"],["culture marketing agency","418","7.1"],["corona cero olympics","311","9.6"]],"margin-top:2px")

  function kpi(l,v,d,t){return '<div class="card kpi"><div class="kpi__label">'+l+'</div><div class="kpi__val">'+v+'</div><span class="delta '+d+'">'+t+'<span class="vs">vs prev 30d</span></span></div>';}

  function initChart(){
    var d=[520,548,505,610,640,598,672,701,688,740,712,690,758,802,781,760,690,712,845,880,861,905,878,940,912,968,1002,975,1040,1088];
    var W=860,H=250,pl=8,pr=8,pt=16,pb=20,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max.apply(null,d),mn=Math.min.apply(null,d);
    var X=function(i){return pl+i/(d.length-1)*iw;},Y=function(v){return pt+(1-(v-mn)/(mx-mn))*ih;};
    var svg=document.getElementById("chart"),NS="http://www.w3.org/2000/svg";
    var CS=getComputedStyle(document.documentElement);
    var ACC=(CS.getPropertyValue("--blue")||"#2563eb").trim();
    var GRID=(CS.getPropertyValue("--grid")||"#eef1f6").trim();
    var SURF=(CS.getPropertyValue("--card")||"#fff").trim();
    function e(n,a){var x=document.createElementNS(NS,n);for(var k in a)x.setAttribute(k,a[k]);return x;}
    for(var g=0;g<=3;g++){var gy=pt+g/3*ih;svg.appendChild(e("line",{x1:pl,y1:gy,x2:W-pr,y2:gy,stroke:GRID,"stroke-width":1}));}
    var line="",area="M "+X(0)+" "+Y(d[0]);
    d.forEach(function(v,i){var x=X(i),y=Y(v);line+=(i?" L ":"M ")+x+" "+y;if(i)area+=" L "+x+" "+y;});
    area+=" L "+X(d.length-1)+" "+(pt+ih)+" L "+X(0)+" "+(pt+ih)+" Z";
    var defs=e("defs",{}),gr=e("linearGradient",{id:"bf",x1:0,y1:0,x2:0,y2:1});
    gr.appendChild(e("stop",{offset:"0%","stop-color":ACC,"stop-opacity":.18}));gr.appendChild(e("stop",{offset:"100%","stop-color":ACC,"stop-opacity":0}));
    defs.appendChild(gr);svg.appendChild(defs);
    svg.appendChild(e("path",{d:area,fill:"url(#bf)"}));
    svg.appendChild(e("path",{d:line,fill:"none",stroke:ACC,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    var cr=e("line",{x1:0,y1:pt,x2:0,y2:pt+ih,stroke:ACC,"stroke-width":1,"stroke-dasharray":"3 3",opacity:0}),dot=e("circle",{r:4.5,fill:SURF,stroke:ACC,"stroke-width":2,opacity:0});
    svg.appendChild(cr);svg.appendChild(dot);
    var tip=document.getElementById("tip");
    svg.addEventListener("mousemove",function(ev){var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(d.length-1,Math.round((px-pl)/iw*(d.length-1)))),x=X(i),y=Y(d[i]);cr.setAttribute("x1",x);cr.setAttribute("x2",x);cr.setAttribute("opacity",1);dot.setAttribute("cx",x);dot.setAttribute("cy",y);dot.setAttribute("opacity",1);tip.style.opacity=1;tip.style.left=x/W*100+"%";tip.style.top=y/H*100+"%";tip.innerHTML="<b>"+d[i].toLocaleString()+"</b> sessions<br><span class='d'>Day "+(i+1)+"</span>";});
    svg.addEventListener("mouseleave",function(){cr.setAttribute("opacity",0);dot.setAttribute("opacity",0);tip.style.opacity=0;});
  }

  // ---- list ----
  function statusOf(it){ if(it.draft) return "Draft"; var t=new Date().toISOString().slice(0,10); if(it.date && it.date>t) return "Scheduled"; return "Published"; }

  // ---- edit ----

  function renderEdit(col,slug){
    var s=SCHEMA[col]; if(!s){view.innerHTML='<div class="empty">Unknown collection.</div>';return;}
    var items=(DATA&&DATA.collections&&DATA.collections[col])||[];
    var entry=slug?(items.filter(function(x){return x.slug===slug;})[0]||{}):{};
    var model={};
    s.fields.forEach(function(f){ if(f.n) model[f.n]=entry[f.n]; });
    model.stats=(entry.stats&&entry.stats.length)?entry.stats.map(function(x){return {value:x.value,label:x.label};}):[];
    model.blocks=null; // full body loads with real editing in Phase 2
    (function(){
      var mv=entry.media;
      if(!mv){
        if(entry.videoYouTube) mv={type:"video",url:"https://www.youtube.com/watch?v="+entry.videoYouTube,images:[]};
        else if(entry.image) mv={type:"image",url:"",images:[{src:entry.image,alt:entry.imageAlt||""}]};

      model.media=mv;

    if(f.t==="media") return '<div class="field">'+lab+'<div id="media"></div></div>';
    if(f.t==="stats") return '<div class="field"><div id="stats"></div><button type="button" class="btn" id="addstat" style="margin-top:2px">+ Add stat</button></div>';

    if(f.t==="seotext") return '<div class="field">'+lab+'<textarea data-f="'+f.n+'" id="metad">'+esc(val||"")+'</textarea><div class="counter" id="metacount"></div><div class="serp" id="serp"></div></div>';

  function newBlock(t){return t==="image"?{type:"image",src:"",alt:"",caption:""}:t==="quote"?{type:"quote",text:"",cite:""}:{type:t,text:""};}
  function drawBlocks(){
    var cont=document.getElementById("blocks"); if(!cont) return; var bs=EDIT.model.blocks; cont.innerHTML="";
    bs.forEach(function(b,i){
      var m=BLOCKTYPES[b.type]||{ic:"¶",l:b.type}, body="";
      if(b.type==="image") body='<input data-k="src" placeholder="/uploads/image.jpg" value="'+esc(b.src)+'"><input data-k="alt" placeholder="ALT text (accessibility)" value="'+esc(b.alt)+'"><input data-k="caption" placeholder="Caption (optional)" value="'+esc(b.caption)+'">';
      else if(b.type==="quote") body='<textarea data-k="text" placeholder="Quote text">'+esc(b.text)+'</textarea><input data-k="cite" placeholder="Attribution" value="'+esc(b.cite)+'">';
      else if(b.type==="heading") body='<input data-k="text" placeholder="Section heading" value="'+esc(b.text)+'">';
      else body='<textarea data-k="text" placeholder="Write a paragraph…">'+esc(b.text)+'</textarea>';
      var d=document.createElement("div"); d.className="block";
      d.innerHTML='<div class="block__bar"><span class="ic">'+m.ic+'</span>'+m.l+'<div class="block__ctrl"><button data-a="up">↑</button><button data-a="down">↓</button><button data-a="del">✕</button></div></div><div class="block__body">'+body+'</div>';
      [].forEach.call(d.querySelectorAll("[data-k]"),function(inp){inp.addEventListener("input",function(){b[inp.getAttribute("data-k")]=inp.value; if(EDIT.updKw)EDIT.updKw();});});
      d.querySelector('[data-a="up"]').onclick=function(){if(i>0){bs.splice(i-1,0,bs.splice(i,1)[0]);drawBlocks();}};
      d.querySelector('[data-a="down"]').onclick=function(){if(i<bs.length-1){bs.splice(i+1,0,bs.splice(i,1)[0]);drawBlocks();}};
      d.querySelector('[data-a="del"]').onclick=function(){bs.splice(i,1);drawBlocks();};
      cont.appendChild(d);
    });
  }

  function wireMedia(){

      var h='<div class="mtoggle"><button type="button" data-t="image" class="'+(isVid?"":"on")+'">🖼 Image</button><button type="button" data-t="video" class="'+(isVid?"on":"")+'">▶ Video</button></div>';

        h+='<div class="field" style="margin-top:14px"><label>Video URL <span class="hint">YouTube or Vimeo link</span></label><input type="text" id="vurl" placeholder="https://www.youtube.com/watch?v=…" value="'+esc(m.url||"")+'"></div>';

      }

        r.querySelector('[data-a="down"]').onclick=function(){if(i<m.images.length-1){m.images.splice(i+1,0,m.images.splice(i,1)[0]);drawCar();}};

  // seo: keyphrase checks + meta counter + google preview
  function wireSeo(){
    var kw=document.getElementById("kw"), md=document.getElementById("metad"), titleInp=view.querySelector('[data-f="title"]');
    function blocksText(){return (EDIT.model.blocks||[]).map(function(b){return (b.text||"")+" "+(b.cite||"");}).join(" ");}
    function updMeta(){
      if(!md) return; var count=document.getElementById("metacount"), serp=document.getElementById("serp"), n=md.value.length;
      count.textContent=n+" / 155 characters"+(n===0?"":(n>=120&&n<=158?", good length":(n>158?", too long":", a little short")));
      count.className="counter "+(n>=120&&n<=158?"good":(n>158?"bad":""));
      var seoT=view.querySelector('[data-f="seoTitle"]'), t=(seoT&&seoT.value)||(titleInp&&titleInp.value)||"Your article title";
      serp.innerHTML='<div class="serp__t">'+esc(t)+'</div><div class="serp__u">csa.global › the-wire › …</div><div class="serp__d">'+esc(md.value||"Your meta description preview appears here.")+'</div>';
    }
    function updKw(){
      if(!kw) return; var box=document.getElementById("kwcheck"), k=kw.value.trim().toLowerCase();
      if(!k){box.innerHTML='<div class="c warn"><span class="dot">!</span>Set a focus keyphrase to see SEO checks.</div>';return;}
      var title=((titleInp&&titleInp.value)||"").toLowerCase(), meta=((md&&md.value)||"").toLowerCase(), body=blocksText().toLowerCase();
      function row(ok,txt){return '<div class="c '+(ok?"ok":"bad")+'"><span class="dot">'+(ok?"✓":"✕")+'</span>'+esc(txt)+'</div>';}
      box.innerHTML=row(title.indexOf(k)>=0,"Keyphrase appears in the title")
        +row(meta.indexOf(k)>=0,"Keyphrase appears in the meta description")
        +row(body.indexOf(k)>=0,"Keyphrase appears in the body")
        +row(body.split(k).length-1>=2,"Keyphrase used at least twice in the body");
    }
    EDIT.updKw=updKw;
    if(md){md.addEventListener("input",function(){updMeta();updKw();}); updMeta();}
    if(kw) kw.addEventListener("input",updKw);
    if(titleInp) titleInp.addEventListener("input",function(){updMeta();updKw();});
    updKw();
  }

    view.innerHTML='<div class="note">🖼 <b>Media library.</b> Every image on the site, click one to copy its path. Uploading new images here lands in Phase 2.</div><div id="medialib"><div class="empty">Loading…</div></div>';
    fetch("/media.json").then(function(r){return r.json();}).then(function(j){
      var imgs=j.images||[];
      var grid=imgs.map(function(im){return '<div class="masset" data-p="'+esc(im.path)+'"><div class="masset__img" style="background-image:url('+esc(im.path)+')"></div><div class="masset__n" title="'+esc(im.path)+'">'+esc(im.name)+'</div></div>';}).join("");
      document.getElementById("medialib").innerHTML='<div class="lhead"><div><h2>All media</h2><div class="sub">'+imgs.length+' images</div></div><div class="ltools"><input id="msearch" class="lsearch" placeholder="Search…"></div></div><div class="mgrid">'+grid+'</div>';
      [].forEach.call(view.querySelectorAll(".masset"),function(a){a.addEventListener("click",function(){var p=a.getAttribute("data-p");if(navigator.clipboard)navigator.clipboard.writeText(p);a.classList.add("copied");setTimeout(function(){a.classList.remove("copied");},900);});});
      var ms=document.getElementById("msearch"); ms.addEventListener("input",function(e){var q=e.target.value.toLowerCase();[].forEach.call(view.querySelectorAll(".masset"),function(a){a.style.display=a.getAttribute("data-p").toLowerCase().indexOf(q)>=0?"":"none";});});
    }).catch(function(){document.getElementById("medialib").innerHTML='<div class="empty">Could not load media index.</div>';});
  }

  function renderHealth(){
    topTitle.textContent="Site Health"; crumb.textContent="Content & SEO checks"; topActions.innerHTML='';
    var C=(DATA&&DATA.collections)||{}, issues=[];
    function add(sev,cat,col,slug,title,msg){issues.push({sev:sev,cat:cat,col:col,slug:slug,title:title,msg:msg});}
    (C.articles||[]).forEach(function(a){
      if(!a.image) add("warn","Media","articles",a.slug,a.title,"No lead image");
      else if(!a.imageAlt) add("bad","Accessibility","articles",a.slug,a.title,"Lead image missing ALT text");
      if(!a.description) add("warn","SEO","articles",a.slug,a.title,"No meta description");
      if(!a.focusKeyphrase) add("warn","SEO","articles",a.slug,a.title,"No focus keyphrase");
      if(!a.category) add("warn","Content","articles",a.slug,a.title,"No category selected");
      if(!a.author) add("warn","Content","articles",a.slug,a.title,"No author");
    });
    (C.caseStudies||[]).forEach(function(c){
      if(!c.serviceArea) add("bad","Content","caseStudies",c.slug,c.title,"Not assigned to a service page");
      if(!c.image) add("warn","Media","caseStudies",c.slug,c.title,"No lead image / poster");
      else if(!c.imageAlt) add("bad","Accessibility","caseStudies",c.slug,c.title,"Lead image missing ALT text");
      if(!c.stats||!c.stats.length) add("warn","Content","caseStudies",c.slug,c.title,"No impact stats");
      if(!c.description) add("warn","SEO","caseStudies",c.slug,c.title,"No meta description");
    });
    (C.talent||[]).forEach(function(t){ if(!t.image) add("warn","Media","talent",t.slug,t.name,"No profile image"); else if(!t.imageAlt) add("bad","Accessibility","talent",t.slug,t.name,"Profile image missing ALT text"); });
    (C.board||[]).forEach(function(b){ if(!b.image) add("warn","Media","board",b.slug,b.name,"No portrait"); });
    (C.clients||[]).forEach(function(cl){ if(!cl.logo) add("bad","Media","clients",cl.slug,cl.name,"No logo uploaded"); });
    (C.awards||[]).forEach(function(aw){ if(!aw.logo) add("warn","Media","awards",aw.slug,aw.name,"No logo (optional, shown as text)"); });
    (C.pages||[]).forEach(function(p){ if(!p.description) add("warn","SEO","pages",p.slug,p.title,"No meta description"); });
    var bad=issues.filter(function(i){return i.sev==="bad";}).length, warn=issues.length-bad;
    var total=0; ["articles","caseStudies","talent","board","clients","awards","pages"].forEach(function(k){total+=(C[k]||[]).length;});
    var score=Math.max(0,100-bad*6-warn*2);
    var scoreColor=score>=85?"var(--up)":score>=60?"#b26b06":"var(--down)", scoreWord=score>=85?"Good":score>=60?"Needs work":"Poor";
    function kpi(v,l,d,color){return '<div class="card hkpi"><div class="hkpi__v"'+(color?' style="color:'+color+'"':'')+'>'+v+'</div><div class="hkpi__l">'+l+'</div><div class="hkpi__d">'+d+'</div></div>';}
    var rows=issues.map(function(i){var cc=i.cat==="Accessibility"?"cat--a11y":i.cat==="SEO"?"cat--seo":i.cat==="Media"?"cat--media":"cat--content";return '<tr class="row" data-go="#/c/'+i.col+'/e/'+encodeURIComponent(i.slug)+'"><td><span class="hdot '+(i.sev==="bad"?"hbad":"hwarn")+'"></span>'+esc(i.msg)+'</td><td><span class="catpill '+cc+'">'+esc(i.cat)+'</span></td><td>'+esc(i.title||i.slug)+'</td><td class="num">'+esc(SCHEMA[i.col]?SCHEMA[i.col].singular:i.col)+'</td></tr>';}).join("");
    view.innerHTML='<div class="note">✚ <b>Site Health</b> scans all your content for problems that hurt SEO, accessibility or completeness, so nothing goes live half-finished. Click any row to jump straight to the fix.</div>'
      +'<div class="hcards">'
      +kpi(score,"Health score, "+scoreWord,"Overall content quality out of 100. Each critical issue −6, each recommendation −2.",scoreColor)
      +kpi(bad,"Needs attention","Critical problems (missing ALT text, a case study with no service page). Fix these first.","var(--down)")
      +kpi(warn,"Recommended","Improvements that help but aren’t breaking anything (e.g. add a focus keyphrase).","#b26b06")
      +kpi(total,"Content items","Total pieces of content across every collection.","")
      +'</div>'
      +'<div class="lhead"><div><h2>Things to check</h2><div class="sub">'+(issues.length?issues.length+" items":"All clear")+'</div></div></div>'
      +'<section class="card">'+(issues.length?('<table><thead><tr><th>Issue</th><th>Category</th><th>Item</th><th class="num">Type</th></tr></thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">Everything looks good, no issues found. 🎉</div>')+'</section>';
    [].forEach.call(view.querySelectorAll("tr.row"),function(tr){tr.addEventListener("click",function(){location.hash=tr.getAttribute("data-go");});});
  }

  function renderUsers(){
    topTitle.textContent="Users"; crumb.textContent="Team & permissions";
    var U=(DATA&&DATA.users)||{}; var users=(U.users||[]).map(function(x){return {name:x.name,email:x.email,role:x.role,access:[].concat(x.access||[]),twoFactor:!!x.twoFactor,lastActive:x.lastActive||""};});
    var roles=U.roles||["Admin","Editor","Author","Custom"];
    var arts=(DATA&&DATA.collections&&DATA.collections.articles)||[];
    function publishedCount(u){ return arts.filter(function(a){return (a.author||"")===u.name;}).length; }
    function accessText(a){ if(a.indexOf("all")>=0) return "All areas"; return a.map(function(k){return SCHEMA[k]?SCHEMA[k].label:k;}).join(", ")||"-"; }
    function fmt(d){ if(!d)return "Never"; try{return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}catch(e){return d;} }
    function draw(){
      var rows=users.map(function(u,i){
        var av=(u.name||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();
        var tfa=u.twoFactor?'<span class="pill pill--pub">On</span>':'<span class="pill pill--draft">Off</span>';
        return '<tr><td><span class="uav">'+esc(av)+'</span><b>'+esc(u.name)+'</b><div class="mini">'+esc(u.email)+'</div></td>'
          +'<td><span class="urole">'+esc(u.role)+'</span></td>'
          +'<td>'+esc(accessText(u.access))+'</td>'
          +'<td>'+tfa+'</td>'
          +'<td class="num">'+publishedCount(u)+'</td>'
          +'<td class="num">'+esc(fmt(u.lastActive))+'</td>'
          +'<td class="num"><button class="ra" data-i="'+i+'" data-a="edit">Edit</button> <button class="ra" data-i="'+i+'" data-a="del">Remove</button></td></tr>';
      }).join("");
      view.innerHTML='<div class="note">◐ <b>Team &amp; permissions.</b> Add teammates, require 2-factor authentication, and set exactly what each can access, e.g. give a writer only <b>The Wire</b>. Real logins + enforcement land in Phase 2 (GitHub accounts + roles).</div>'
        +'<div class="lhead"><div><h2>Users</h2><div class="sub">'+users.length+' people</div></div></div>'
        +'<section class="card"><table><thead><tr><th>User</th><th>Role</th><th>Access</th><th>2FA</th><th class="num">Published</th><th class="num">Last active</th><th class="num">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></section><div id="userform"></div>';
      topActions.innerHTML='<button class="btn btn--primary" id="adduser">+ Add user</button>';
      document.getElementById("adduser").onclick=function(){editUser(-1);};
      [].forEach.call(view.querySelectorAll("section .ra"),function(b){b.addEventListener("click",function(){var i=+b.getAttribute("data-i"),a=b.getAttribute("data-a");if(a==="del"){users.splice(i,1);draw();}else editUser(i);});});
    }
    function editUser(i){
      var u=i>=0?users[i]:{name:"",email:"",role:"Custom",access:[],twoFactor:false,lastActive:""};
      var roleOpts=roles.map(function(r){return '<option'+(u.role===r?" selected":"")+'>'+esc(r)+'</option>';}).join("");
      var acc='<label class="relopt"><input type="checkbox" data-acc="all"'+(u.access.indexOf("all")>=0?" checked":"")+'> Everything (all areas)</label>'
        +ORDER.map(function(k){return '<label class="relopt"><input type="checkbox" data-acc="'+k+'"'+(u.access.indexOf(k)>=0?" checked":"")+'> '+esc(SCHEMA[k].label)+'</label>';}).join("");
      document.getElementById("userform").innerHTML='<div class="card" style="padding:20px;margin-top:16px"><div class="section-h" style="margin-top:0">'+(i>=0?"Edit user":"Add user")+'</div>'
        +'<div class="field"><label>Name</label><input type="text" id="uname" value="'+esc(u.name)+'"></div>'
        +'<div class="field"><label>Email</label><input type="text" id="uemail" value="'+esc(u.email)+'"></div>'
        +'<div class="field"><label>Role</label><select id="urole2">'+roleOpts+'</select></div>'
        +'<div class="field"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600"><input type="checkbox" id="u2fa"'+(u.twoFactor?" checked":"")+' style="width:auto;accent-color:var(--blue)"> Require two-factor authentication (2FA)</label></div>'
        +'<div class="field"><label>Access</label><div class="relbox">'+acc+'</div></div>'
        +'<div class="formbar"><button class="btn btn--primary" id="usave">Save user</button><button class="btn" id="ucancel">Cancel</button><span style="font-size:12.5px;color:var(--muted)">Enforced in Phase 2</span></div></div>';
      document.getElementById("ucancel").onclick=function(){document.getElementById("userform").innerHTML="";};
      document.getElementById("usave").onclick=function(){
        var a=[]; [].forEach.call(view.querySelectorAll("[data-acc]"),function(cb){if(cb.checked)a.push(cb.getAttribute("data-acc"));});
        var nu={name:document.getElementById("uname").value,email:document.getElementById("uemail").value,role:document.getElementById("urole2").value,access:a,twoFactor:document.getElementById("u2fa").checked,lastActive:u.lastActive};
        if(i>=0)users[i]=nu; else users.push(nu); draw();
      };
    }
    draw();
  }

  function renderRevisions(){
    topTitle.textContent="Revisions"; crumb.textContent="Version history"; topActions.innerHTML='';
    var sample=[
      {t:"The Afrobeats Atlas",k:"Article",by:"Robert Greeff",ch:"Edited body + meta description",when:"9 Jul 2026, 14:20",cur:true},
      {t:"Corona Studios: First Beach",k:"Case Study",by:"Chad Lancaster",ch:"Updated impact stats",when:"8 Jul 2026, 11:03"},
      {t:"Homepage settings",k:"Settings",by:"Robert Greeff",ch:"Changed footer tagline",when:"8 Jul 2026, 09:41"},
      {t:"Naomi Campbell",k:"Talent",by:"Chad Lancaster",ch:"Replaced profile image",when:"6 Jul 2026, 16:12"},
      {t:"The Afrobeats Atlas",k:"Article",by:"Robert Greeff",ch:"Created",when:"6 Jul 2026, 10:00"}
    ];
    var rows=sample.map(function(r){
      return '<tr class="row"><td><b>'+esc(r.t)+'</b> <span class="pill">'+esc(r.k)+'</span></td><td>'+esc(r.ch)+'</td><td>'+esc(r.by)+'</td><td class="num">'+esc(r.when)+'</td>'
        +'<td class="num"><button class="ra">Compare</button> '+(r.cur?'<button class="ra" disabled style="opacity:.4;cursor:default">Current</button>':'<button class="ra">Restore</button>')+'</td></tr>';
    }).join("");
    view.innerHTML='<div class="note">↺ <b>Revision history.</b> Every save is versioned, if something is published wrong, restore any earlier version with one click. Nothing is ever lost. This reads your full Git commit history in Phase 2.</div>'
      +'<div class="lhead"><div><h2>Recent changes</h2><div class="sub">'+sample.length+' versions</div></div></div>'
      +'<section class="card"><table><thead><tr><th>Item</th><th>Change</th><th>By</th><th class="num">When</th><th class="num">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
    [].forEach.call(view.querySelectorAll(".ra"),function(b){if(!b.disabled)b.addEventListener("click",function(){alert("Compare / restore lands in Phase 2, it reads your Git history so any version can be brought back instantly.");});});
  }

  // ---- theme toggle (persisted; re-renders so the chart picks up the new colours) ----
  (function(){
    var t=document.getElementById("themetog");
    if(!t) return;
    t.addEventListener("click",function(){
      var dark=document.documentElement.getAttribute("data-theme")==="dark";
      if(dark) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme","dark");
      try{ localStorage.setItem("csa-portal-theme", dark?"light":"dark"); }catch(e){}
      if(DATA) render();
    });
  })();

  // ---- boot ----
  window.addEventListener("hashchange",render);
  fetch("/content.json").then(function(r){return r.json();}).then(function(j){DATA=j;render();}).catch(function(){DATA={collections:{}};render();});
})();
</script>
